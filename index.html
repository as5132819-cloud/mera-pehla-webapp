<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Modern Calculator</title>
    <style>
        /* CSS: Yahan se design shuru hota hai */
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #1e1e2e; }
        .calculator { background: #313244; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 320px; }
        #display { width: 100%; height: 60px; font-size: 32px; text-align: right; margin-bottom: 20px; border: none; background: transparent; color: #cdd6f4; outline: none; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 20px; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; background: #45475a; color: #cdd6f4; }
        button:hover { background: #585b70; transform: translateY(-2px); }
        .operator { background: #fab387; color: #1e1e2e; font-weight: bold; }
        .equal { background: #a6e3a1; color: #1e1e2e; grid-column: span 2; }
        .clear { background: #f38ba8; color: #1e1e2e; grid-column: span 2; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled placeholder="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="appendToDisplay('/')">/</button>
        <button class="operator" onclick="appendToDisplay('*')">×</button>
        
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button class="operator" onclick="appendToDisplay('-')">-</button>
        
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button class="operator" onclick="appendToDisplay('+')">+</button>
        
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="calculateResult()">=</button>
        
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button class="equal" onclick="calculateResult()">Barabar (=)</button>
    </div>
</div>

<script>
    /* JavaScript: Yahan se dimaag (logic) shuru hota hai */
    let display = document.getElementById('display');

    function appendToDisplay(input) {
        display.value += input;
    }

    function clearDisplay() {
        display.value = "";
    }

    function calculateResult() {
        try {
            // eval() function mathematical string ko solve karta hai
            display.value = eval(display.value);
        } catch (error) {
            display.value = "Galti!";
        }
    }
</script>

</body>
</html>
